version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: slayql_api
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - LLM_PROVIDER=${LLM_PROVIDER:-opentk}
      - OPENTK_KEY=${OPENTK_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - EXECUTION_MODEL=${EXECUTION_MODEL:-}
      - DEEP_MODEL=${DEEP_MODEL:-}
      - EMAIL=${EMAIL:-}
      - APP_PASS=${APP_PASS:-}
      - EMAIL_NOTIFICATIONS=${EMAIL_NOTIFICATIONS:-false}
      - REPORT_SCHEDULER=${REPORT_SCHEDULER:-true}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      - DATABASE_URL=${DATABASE_URL}
      - BACKEND_DATABASE_SCHEMA=${BACKEND_DATABASE_SCHEMA:-slayql}
      - DEMO_POSTGRES_URL=${DEMO_POSTGRES_URL}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
      - CONNECTION_DATA_DIR=/app/backend/data/connections
      - QUERY_TIMEOUT_SECONDS=10
      - MAX_RESULT_ROWS=200
    volumes:
      - sqlite_data:/app/backend/data
    networks:
      - slayql_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: slayql_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - slayql_network

volumes:
  sqlite_data:

networks:
  slayql_network:
    driver: bridge
