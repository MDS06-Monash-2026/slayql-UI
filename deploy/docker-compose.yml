version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: slayql_api
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      - DEMO_POSTGRES_URL=${DEMO_POSTGRES_URL}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
      - CONNECTION_DATA_DIR=/app/backend/data/connections
      - QUERY_TIMEOUT_SECONDS=10
      - MAX_RESULT_ROWS=200
    volumes:
      - sqlite_data:/app/backend/data
    networks:
      - slayql_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: slayql_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - slayql_network

volumes:
  sqlite_data:

networks:
  slayql_network:
    driver: bridge
